version: "3.8"

services:
  db:
    image: postgres:15
    container_name: chicago-crimes-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: chicago_crimes
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: chicago-crimes-api
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DB_URL=postgresql+psycopg2://admin:admin@db:5432/chicago_crimes

volumes:
  postgres_data: